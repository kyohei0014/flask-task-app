<!DOCTYPE html>
<html>
<head>
    <title>ユーザー登録</title>
</head>
<body>

<h2>ユーザー登録</h2>

<form method="POST">

    <label>ユーザー名</label><br>
    <input type="text" name="username" required><br><br>

    <label>パスワード</label><br>
    <input type="password" name="password" required><br><br>

    <button type="submit">登録</button>

</form>

<p>
すでにアカウントがある場合
<a href="/login">ログイン</a>
</p>

</body>
</html>
